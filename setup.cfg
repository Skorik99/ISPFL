[metadata]
name = ispfl
version = 0.1.0
description = Intelligent Selection of Participants for Federated Learning

[options]
packages = find_namespace:
package_dir =
    =src
install_requires =
    hydra-core==1.3.2
    opencv-python==4.11.0.86
    pandas==2.2.3
    pip==22.0.2
    datasets==2.21.0
    requests==2.32.3
    scikit-learn==1.6.1
    scipy==1.15.3
    setuptools==59.6.0
    torchvision==0.21.0
    gpytorch==1.14.2
python_requires = >=3.10

[options.packages.find]
where = src
